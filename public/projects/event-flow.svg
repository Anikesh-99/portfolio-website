<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" font-family="ui-monospace, Menlo, monospace">
  <rect width="800" height="170" fill="#0b0e14"/>
  <text x="40" y="40" fill="#e8e4da" font-size="15" font-weight="600">every bar flows through four events</text>

  <!-- row of boxes -->
  <g font-size="11">
    <rect x="40"  y="70" width="88" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="84"  y="91" fill="#ffb454" text-anchor="middle">Market</text>
    <rect x="146" y="70" width="88" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="190" y="91" fill="#e8e4da" text-anchor="middle">Strategy</text>
    <rect x="252" y="70" width="88" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="296" y="91" fill="#ffb454" text-anchor="middle">Signal</text>
    <rect x="358" y="70" width="88" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="402" y="91" fill="#e8e4da" text-anchor="middle">Portfolio</text>
    <rect x="464" y="70" width="88" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="508" y="91" fill="#ffb454" text-anchor="middle">Order</text>
    <rect x="570" y="70" width="88" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="614" y="91" fill="#e8e4da" text-anchor="middle">Execution</text>
    <rect x="676" y="70" width="84" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="718" y="91" fill="#ffb454" text-anchor="middle">Fill</text>
  </g>
  <g stroke="#8f95a0" stroke-width="1.5">
    <line x1="128" y1="87" x2="143" y2="87"/>
    <line x1="234" y1="87" x2="249" y2="87"/>
    <line x1="340" y1="87" x2="355" y2="87"/>
    <line x1="446" y1="87" x2="461" y2="87"/>
    <line x1="552" y1="87" x2="567" y2="87"/>
    <line x1="658" y1="87" x2="673" y2="87"/>
  </g>
  <g fill="#8f95a0">
    <path d="M143 87 l-5 -3.5 v7 z"/><path d="M249 87 l-5 -3.5 v7 z"/><path d="M355 87 l-5 -3.5 v7 z"/>
    <path d="M461 87 l-5 -3.5 v7 z"/><path d="M567 87 l-5 -3.5 v7 z"/><path d="M673 87 l-5 -3.5 v7 z"/>
  </g>

  <text x="40" y="142" fill="#8f95a0" font-size="12">a signal on bar t's close fills at bar t+1's open · a unit test pins this down</text>
</svg>
