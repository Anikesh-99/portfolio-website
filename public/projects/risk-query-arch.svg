<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-monospace, Menlo, monospace">
  <rect width="800" height="300" fill="#0b0e14"/>
  <text x="40" y="44" fill="#e8e4da" font-size="15" font-weight="600">tool-calling architecture</text>

  <!-- question -->
  <rect x="40" y="120" width="170" height="60" rx="4" fill="none" stroke="#2a2f3a"/>
  <text x="125" y="145" fill="#8f95a0" font-size="11" text-anchor="middle">"what's my DV01</text>
  <text x="125" y="161" fill="#8f95a0" font-size="11" text-anchor="middle">across rates books?"</text>

  <!-- agent -->
  <rect x="270" y="120" width="160" height="60" rx="4" fill="none" stroke="#ffb454"/>
  <text x="350" y="145" fill="#ffb454" font-size="12" text-anchor="middle">Claude agent</text>
  <text x="350" y="162" fill="#8f95a0" font-size="11" text-anchor="middle">picks tools, cites data</text>

  <!-- tools -->
  <g font-size="11">
    <rect x="490" y="60"  width="150" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="565" y="81"  fill="#e8e4da" text-anchor="middle">portfolio_greeks()</text>
    <rect x="490" y="133" width="150" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="565" y="154" fill="#e8e4da" text-anchor="middle">portfolio_var()</text>
    <rect x="490" y="206" width="150" height="34" rx="4" fill="none" stroke="#2a2f3a"/>
    <text x="565" y="227" fill="#e8e4da" text-anchor="middle">dv01_by_book()</text>
  </g>

  <!-- positions -->
  <rect x="690" y="120" width="80" height="60" rx="4" fill="none" stroke="#2a2f3a"/>
  <text x="730" y="145" fill="#8f95a0" font-size="11" text-anchor="middle">live</text>
  <text x="730" y="161" fill="#8f95a0" font-size="11" text-anchor="middle">positions</text>

  <!-- arrows -->
  <g stroke="#8f95a0" stroke-width="1.5" fill="none">
    <line x1="210" y1="150" x2="265" y2="150"/>
    <line x1="430" y1="150" x2="450" y2="150"/>
    <path d="M450 150 L485 77"/>
    <line x1="450" y1="150" x2="485" y2="150"/>
    <path d="M450 150 L485 223"/>
    <line x1="640" y1="150" x2="685" y2="150"/>
  </g>
  <g fill="#8f95a0">
    <path d="M265 150 l-6 -4 v8 z"/>
    <path d="M485 77 l-7 -1 4 7 z"/>
    <path d="M485 150 l-6 -4 v8 z"/>
    <path d="M485 223 l-4 -7 -3 7 z"/>
    <path d="M685 150 l-6 -4 v8 z"/>
  </g>

  <text x="40" y="272" fill="#8f95a0" font-size="12">an eval harness scores answers against hand-computed risk numbers</text>
</svg>
