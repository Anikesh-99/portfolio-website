<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-monospace, Menlo, monospace">
  <rect width="800" height="300" fill="#0b0e14"/>
  <text x="40" y="44" fill="#e8e4da" font-size="15" font-weight="600">two kinds of graders</text>

  <!-- dataset -->
  <rect x="40" y="120" width="130" height="60" rx="4" fill="none" stroke="#2a2f3a"/>
  <text x="105" y="145" fill="#8f95a0" font-size="11" text-anchor="middle">dataset</text>
  <text x="105" y="161" fill="#8f95a0" font-size="11" text-anchor="middle">(questions)</text>

  <!-- model -->
  <rect x="230" y="120" width="140" height="60" rx="4" fill="none" stroke="#2a2f3a"/>
  <text x="300" y="145" fill="#e8e4da" font-size="12" text-anchor="middle">model under test</text>
  <text x="300" y="162" fill="#8f95a0" font-size="11" text-anchor="middle">pluggable adapter</text>

  <!-- graders -->
  <rect x="430" y="72"  width="200" height="56" rx="4" fill="none" stroke="#2a2f3a"/>
  <text x="530" y="95"  fill="#e8e4da" font-size="12" text-anchor="middle">rule-based graders</text>
  <text x="530" y="112" fill="#8f95a0" font-size="11" text-anchor="middle">exact · numeric · regex · schema</text>

  <rect x="430" y="172" width="200" height="56" rx="4" fill="none" stroke="#ffb454"/>
  <text x="530" y="195" fill="#ffb454" font-size="12" text-anchor="middle">LLM-as-judge</text>
  <text x="530" y="212" fill="#8f95a0" font-size="11" text-anchor="middle">for open-ended answers</text>

  <!-- report -->
  <rect x="690" y="120" width="80" height="60" rx="4" fill="none" stroke="#2a2f3a"/>
  <text x="730" y="145" fill="#8f95a0" font-size="11" text-anchor="middle">pass rates</text>
  <text x="730" y="161" fill="#8f95a0" font-size="11" text-anchor="middle">by category</text>

  <!-- arrows -->
  <g stroke="#8f95a0" stroke-width="1.5" fill="none">
    <line x1="170" y1="150" x2="225" y2="150"/>
    <path d="M370 150 L425 100"/>
    <path d="M370 150 L425 200"/>
    <path d="M630 100 L685 145"/>
    <path d="M630 200 L685 155"/>
  </g>
  <g fill="#8f95a0">
    <path d="M225 150 l-6 -4 v8 z"/>
    <path d="M425 100 l-7 1 3 6 z"/>
    <path d="M425 200 l-3 -6 -4 7 z"/>
    <path d="M685 145 l-7 -2 2 7 z"/>
    <path d="M685 155 l-5 5 7 1 z"/>
  </g>

  <text x="40" y="272" fill="#8f95a0" font-size="12">runs offline with a stub model and deterministic mock judge · no API key needed</text>
</svg>
